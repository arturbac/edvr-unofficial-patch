# EDVR release build and code-signing pipeline.
#
# Builds the two graphics/runtime DLLs and the installers that embed them (the
# VR edition's and the flat edition's), submits the DLLs to SignPath for
# Authenticode signing, rebuilds both installers around the now-signed DLLs,
# signs those too, packages the release archives and hashes them -- then
# stops. It never creates the GitHub release: a signed zip still has to fly
# before anyone is told to install it.
#
# Packaging happens only on a run from a v* tag. tools\package_native.py
# refuses binaries not stamped exactly v<version> or <version>, which is what
# `git describe` prints on a clean checkout of that tag, so a branch run (or a
# manual dispatch from a branch) proves the build, the signing and the
# installer rebuild but stops before packaging. Dispatch from the tag itself to
# repeat a release run.
#
# Reads, from repository configuration (Settings -> Secrets and variables):
#   secret   SIGNPATH_API_TOKEN            SignPath API token
#   variable SIGNPATH_SIGNING              'true' to submit anything for
#                                           signing; anything else (or unset)
#                                           runs the whole pipeline unsigned,
#                                           so this workflow proves itself
#                                           before a SignPath project exists
#   variable SIGNPATH_ORGANIZATION_ID      SignPath organization id
#   variable SIGNPATH_PROJECT_SLUG         SignPath project slug
#   variable SIGNPATH_POLICY_SLUG          SignPath signing-policy slug
#   variable SIGNPATH_ARTIFACT_DLLS        artifact-configuration slug for
#                                           the d3d11.dll / openvr_api.dll pair
#   variable SIGNPATH_ARTIFACT_INSTALLER   artifact-configuration slug for
#                                           the installer pair: its <pe-file>
#                                           entries name edvr-installer.exe
#                                           and edvr-flat-installer.exe
name: Release build

"on":
  push:
    tags:
      - 'v*'
    branches:
      # TEMPORARY: proves the workflow on its own branch; remove before merging to main
      - claude/signpath-release-signing
  workflow_dispatch:
    inputs:
      version:
        description: "label for the artifact names on a run from a branch; a run from a v* tag takes its version from the tag"
        type: string
        required: false
        default: "0.0.0"
      sign:
        description: "submit to SignPath -- only takes effect when the SIGNPATH_SIGNING repository variable is 'true'"
        type: boolean
        default: true
      dlss:
        description: "fetch NVIDIA's DLSS SDK so the build carries nvngx_dlss.dll"
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

concurrency: release-${{ github.ref }}

jobs:
  release:
    # Pinned, not windows-latest: since 2025 that label is the Windows Server
    # 2025 image carrying Visual Studio 2026 only, and the first proving run
    # showed it -- tools\fetch_ffx_dx11.py asks CMake for the "Visual Studio
    # 17 2022" generator and found no instance, and build.bat would have
    # compiled with a toolset no EDVR release has been built with. windows-2022
    # is VS 2022, the same major toolset as the local builds. When GitHub
    # retires this image, fetch_ffx_dx11.py needs to pick its generator from
    # vswhere and the build needs proving on the newer compiler first.
    runs-on: windows-2022
    # Two signing requests, each approved by hand and each allowed to wait
    # two hours, plus the build itself.
    timeout-minutes: 330
    defaults:
      run:
        shell: pwsh
    env:
      SIGN: "${{ vars.SIGNPATH_SIGNING == 'true' && (github.event_name != 'workflow_dispatch' || inputs.sign) }}"
      DLSS: "${{ github.event_name != 'workflow_dispatch' || inputs.dlss }}"
    steps:
      - name: Check out EDVR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The runner image's default python is whatever the image was built
      # with; pin one so the tools see the same interpreter every release.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The rigs are standard-library Python except eye_draw_snapshot.py,
      # whose self-test exports PNGs through Pillow; the runner's interpreter
      # has nothing installed beyond the standard library.
      - name: Install Python packages the rigs need
        run: |
          python -m pip install --disable-pip-version-check --quiet pillow
          if ($LASTEXITCODE -ne 0) { throw "pip install pillow failed" }

      - name: Compute release version
        run: |
          $package = 'false'
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            # Only here can package_native.py accept the binaries: build.bat
            # stamps them from `git describe`, which on a clean checkout of
            # this tag prints exactly v<version>.
            $version = $env:GITHUB_REF_NAME.TrimStart('v')
            $package = 'true'
          } elseif ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            # A dispatch from a branch: the input only labels the artifacts.
            $version = '${{ inputs.version }}'
          } else {
            # Push to the temporary proving branch below: a placeholder label
            # for the artifact names, never a real, installable version.
            $version = '0.0.0'
          }
          Write-Host "VERSION=$version PACKAGE=$package"
          Add-Content -Path $env:GITHUB_ENV -Value "VERSION=$version"
          Add-Content -Path $env:GITHUB_ENV -Value "PACKAGE=$package"

      - name: Print toolchain versions
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            $vsPath = & $vswhere -latest -products * -property installationPath
            Write-Host "Visual Studio: $vsPath"
          } else {
            Write-Host "vswhere not found at $vswhere"
          }
          python --version
          cmake --version
          git --version

      - name: Fetch OpenXR loader
        run: |
          python tools\fetch_openxr_loader.py
          if ($LASTEXITCODE -ne 0) { throw "fetch_openxr_loader.py failed" }

      - name: Fetch FidelityFX DX11 SDK
        run: |
          python tools\fetch_ffx_dx11.py
          if ($LASTEXITCODE -ne 0) { throw "fetch_ffx_dx11.py failed" }

      - name: Fetch NVIDIA DLSS SDK
        if: env.DLSS == 'true'
        run: |
          python tools\fetch_ngx.py
          if ($LASTEXITCODE -ne 0) { throw "fetch_ngx.py failed" }

      # --keep-going: the pool reports every failing rig rather than the first, so one run shows the whole picture; the exit status is unchanged.
      - name: Build
        shell: cmd
        run: call "%GITHUB_WORKSPACE%\build.bat" --keep-going || exit /b 1

      - name: Check build outputs
        run: |
          $files = 'build\d3d11.dll', 'build\openvr_api.dll', 'build\edvr-installer.exe', 'build\edvr-flat-installer.exe'
          $missing = $false
          foreach ($f in $files) {
            if (Test-Path $f) {
              $item = Get-Item $f
              Write-Host ("{0}  {1:N0} bytes  FileVersion={2}" -f $item.FullName, $item.Length, $item.VersionInfo.FileVersion)
            } else {
              Write-Host "MISSING: $f"
              $missing = $true
            }
          }
          if ($missing) { throw "build did not produce all expected outputs" }

      - name: Upload DLLs (round one, unsigned)
        id: dlls
        uses: actions/upload-artifact@v4
        with:
          name: edvr-dlls-${{ env.VERSION }}
          path: |
            build/d3d11.dll
            build/openvr_api.dll
          if-no-files-found: error
          retention-days: 14

      - name: Submit DLLs to SignPath
        if: env.SIGN == 'true'
        uses: SignPath/github-action-submit-signing-request@v3
        with:
          api-token: "${{ secrets.SIGNPATH_API_TOKEN }}"
          organization-id: "${{ vars.SIGNPATH_ORGANIZATION_ID }}"
          project-slug: "${{ vars.SIGNPATH_PROJECT_SLUG }}"
          signing-policy-slug: "${{ vars.SIGNPATH_POLICY_SLUG }}"
          artifact-configuration-slug: "${{ vars.SIGNPATH_ARTIFACT_DLLS }}"
          github-artifact-id: "${{ steps.dlls.outputs.artifact-id }}"
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: signed/dlls

      - name: Install signed DLLs
        if: env.SIGN == 'true'
        run: |
          Copy-Item signed\dlls\d3d11.dll build\d3d11.dll -Force
          Copy-Item signed\dlls\openvr_api.dll build\openvr_api.dll -Force
          foreach ($f in 'build\d3d11.dll', 'build\openvr_api.dll') {
            $sig = Get-AuthenticodeSignature $f
            if ($sig.Status -ne 'Valid') { throw "$f is not validly signed: $($sig.Status)" }
            Write-Host "$f signed by $($sig.SignerCertificate.Subject)"
          }

      # Both editions' installers embed the graphics DLL, so both are rebuilt
      # from the signed bytes and signed in one request.
      - name: Rebuild installers around signed DLLs
        shell: cmd
        run: call "%GITHUB_WORKSPACE%\build.bat" --installer-only || exit /b 1

      - name: Upload installers (round two)
        id: installers
        uses: actions/upload-artifact@v4
        with:
          name: edvr-installers-${{ env.VERSION }}
          path: |
            build/edvr-installer.exe
            build/edvr-flat-installer.exe
          if-no-files-found: error

      - name: Submit installers to SignPath
        if: env.SIGN == 'true'
        uses: SignPath/github-action-submit-signing-request@v3
        with:
          api-token: "${{ secrets.SIGNPATH_API_TOKEN }}"
          organization-id: "${{ vars.SIGNPATH_ORGANIZATION_ID }}"
          project-slug: "${{ vars.SIGNPATH_PROJECT_SLUG }}"
          signing-policy-slug: "${{ vars.SIGNPATH_POLICY_SLUG }}"
          artifact-configuration-slug: "${{ vars.SIGNPATH_ARTIFACT_INSTALLER }}"
          github-artifact-id: "${{ steps.installers.outputs.artifact-id }}"
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: signed/installers

      - name: Install signed installers
        if: env.SIGN == 'true'
        run: |
          foreach ($name in 'edvr-installer.exe', 'edvr-flat-installer.exe') {
            Copy-Item "signed\installers\$name" "build\$name" -Force
            $sig = Get-AuthenticodeSignature "build\$name"
            if ($sig.Status -ne 'Valid') { throw "build\$name is not validly signed: $($sig.Status)" }
            Write-Host "build\$name signed by $($sig.SignerCertificate.Subject)"
          }

      - name: Not packaged (not a tag run)
        if: env.PACKAGE != 'true'
        run: |
          Write-Host "This run is from $env:GITHUB_REF, not a v* tag, so it stops before packaging:"
          Write-Host "tools\package_native.py accepts only binaries stamped with the release version."
          Write-Host "What this run proves: the build, the signing, and the installer rebuild above."

      # The two archives package.bat stages: the VR release, then the flat one.
      - name: Package release archives
        if: env.PACKAGE == 'true'
        run: |
          $packageArgs = @($env:VERSION)
          if ($env:DLSS -ne 'true') { $packageArgs += '--no-dlss' }
          python tools\package_native.py @packageArgs
          if ($LASTEXITCODE -ne 0) { throw "package_native.py failed (VR edition)" }
          python tools\package_native.py @packageArgs --profile flat
          if ($LASTEXITCODE -ne 0) { throw "package_native.py failed (flat edition)" }

      - name: Hash release files
        if: env.PACKAGE == 'true'
        run: |
          $lines = Get-ChildItem dist -File |
            Where-Object { $_.Extension -in '.zip', '.exe' } |
            ForEach-Object {
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
              "$hash  $($_.Name)"
            }
          $lines | Set-Content -Path dist\SHA256SUMS.txt -Encoding utf8
          Get-Content dist\SHA256SUMS.txt

      - name: Upload release artifacts
        if: env.PACKAGE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: edvr-${{ env.VERSION }}
          path: |
            dist/edvr-${{ env.VERSION }}.zip
            dist/edvr-installer-${{ env.VERSION }}.zip
            dist/edvr-flat-${{ env.VERSION }}.zip
            dist/edvr-flat-installer-${{ env.VERSION }}.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Next steps
        if: env.PACKAGE == 'true'
        run: |
          Write-Host "================================================================"
          Write-Host "Built, not published."
          Write-Host ""
          Write-Host "By hand, from here:"
          Write-Host "  1. Download the edvr-$env:VERSION artifact from this run."
          Write-Host "  2. Install it and fly the SIGNED installer -- a green workflow"
          Write-Host "     run is not a test flight."
          Write-Host "  3. Publish the GitHub release yourself, pasting in the SHA-256"
          Write-Host "     lines below."
          Write-Host ""
          if (Test-Path dist\SHA256SUMS.txt) { Get-Content dist\SHA256SUMS.txt }
          Write-Host "================================================================"
